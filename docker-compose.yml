services:
  backend-centrifungal:
    build: ./backend
    container_name: backend-centrifungal
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=192
      - DB_PATH=/data/centrifungal.sqlite
      - CATALOGUE_URL=http://static-centrifungal/catalogue.json
    volumes:
      - centrifungal-backend-data:/data
    mem_limit: 220m
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api-centrifungal.rule=Host(`${CLIENT_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api-centrifungal.entrypoints=websecure
      - traefik.http.routers.api-centrifungal.tls.certresolver=${CERT_RESOLVER:-letsencrypt-prod}
      - traefik.http.routers.api-centrifungal.priority=200
      - traefik.http.services.api-centrifungal.loadbalancer.server.port=3001
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  static-centrifungal:
    image: nginx:1.27-alpine
    container_name: static-centrifungal
    restart: unless-stopped
    volumes:
      - ./out:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.static-centrifungal.rule=Host(`${CLIENT_DOMAIN}`)
      - traefik.http.routers.static-centrifungal.entrypoints=websecure
      - traefik.http.routers.static-centrifungal.tls.certresolver=${CERT_RESOLVER:-letsencrypt-prod}
      - traefik.http.services.static-centrifungal.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  centrifungal-backend-data:

networks:
  proxy:
    external: true
