# Centrifungal storefront: Next.js static export served by nginx behind Traefik.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. frame-ancestors 'self' keeps Tina's visual editor (same origin iframe) working.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.web3forms.com https://*.tina.io https://content.tinajs.io; frame-src https://js.stripe.com https://checkout.stripe.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://checkout.stripe.com https://api.web3forms.com" always;
    # Remove at launch
    add_header X-Robots-Tag "noindex" always;

    # Hashed Next assets never change
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Old URLs
    location = /care { return 301 /care-instructions; }
    location = /shop.html { return 301 /shop; }

    # Clean URLs: /shop -> shop.html, /product/x -> product/x.html, directories, then 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    location ~ /\. { deny all; }
}
