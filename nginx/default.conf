server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: content is fetched cross-origin from the Payload CMS (prod + dev hosts).
    # No Stripe entry needed - checkout is a top-level redirect to Stripe's page.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://cms.centrifungal.co.uk https://cms-centrifungal.dev.skeleton-crew.co.uk; connect-src 'self' https://cms.centrifungal.co.uk https://cms-centrifungal.dev.skeleton-crew.co.uk; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Pre-launch: keep the dev/staging site out of search results. Remove at prod launch.
    add_header X-Robots-Tag "noindex" always;

    # Block dotfile access (.DS_Store, .git, etc.)
    location ~ /\. {
        return 404;
    }

    # Legacy friendly path -> canonical care-instructions page.
    location = /care {
        return 301 /care-instructions;
    }

    # Clean product URLs: /product/{slug} -> product.html?slug={slug}.
    # Slug: 1-80 chars, lowercase a-z/0-9/hyphen. Anything else falls through to 404.
    location ~ "^/product/([a-z0-9][a-z0-9-]{0,79})$" {
        rewrite ^ /product.html?slug=$1 last;
    }

    # Clean URLs for content pages: /about -> about.html, /shop -> shop.html, etc.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
